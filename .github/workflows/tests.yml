name: tests

on:
  push:
    branches: [main, staging, pmz_dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, self-contained suite on the NumPy backend across supported Pythons.
  # Optional engines (torch, ovito, orb-models) are absent here, so their tests
  # skip rather than fail.
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core deps + package (no ovito/backport deps)
        run: |
          python -m pip install --upgrade pip
          # Runtime deps PySlice actually needs at import time. We deliberately
          # skip the pyproject `ovito` / `dataclasses` / `pathlib` entries: ovito
          # needs a special index and the latter two are stdlib now (their PyPI
          # backports break on modern Python). Install the package itself with
          # --no-deps so those do not get pulled in.
          pip install numpy scipy ase h5py matplotlib tqdm typing-extensions pytest
          pip install -e . --no-deps
      - name: Run test suite
        run: pytest -ra

  # Optional: same suite with the Torch backend so the np/torch parity tests run.
  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core deps + CPU Torch + package
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy ase h5py matplotlib tqdm typing-extensions pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . --no-deps
      - name: Run test suite (Torch backend available)
        run: pytest -ra
