name: tests

on:
  push:
    branches: [main, staging, pmz_dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, self-contained suite on the NumPy backend across supported Pythons.
  # Optional engines (torch, ovito, orb-models) are absent here, so their tests
  # skip rather than fail.
  cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # ovito is an optional extra (own index) and orb-models is heavy, so we
          # install neither here; their tests skip. The remaining runtime deps
          # are all plain PyPI, so a normal editable install just works.
          pip install -e .
          pip install pytest pytest-cov
      - name: Run test suite with coverage
        run: pytest -ra --cov=pyslice --cov-report=term-missing --cov-report=xml

  # Optional: same suite with the Torch backend so the np/torch parity tests run.
  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + CPU Torch + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov
      - name: Run test suite (Torch backend available)
        run: pytest -ra
