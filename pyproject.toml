[project]
name = "PySlice"
version = "0.1.0"
description = "PyTorch based package for EELS calculations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase",
    "dataclasses",
    "matplotlib",
    "numpy",
    "ovito",
    "pathlib",
    "scipy",
    "tqdm",
    "typing-extensions",
    "h5py",
]

[project.optional-dependencies]
fast = ["torch","torchvision"]
test = ["pytest>=8"]
md = ["orb-models>=0.6.0; python_version < '3.13'"]
sea = ["sea-eco", "sea-sand"]

[tool.uv.sources]
sea-eco = { path = "../sea-eco", editable = true }
sea-sand = { path = "../sea-sand", editable = true }

[project.urls]
Homepage = "https://github.com/h-walk/PySlice"

[tool.setuptools.package-data]
mypkg = ["data/*.txt", "data/*.json"]

[tool.hatch.build]
include = [
    "src/pyslice/data/*.txt",
    "src/pyslice/data/*.json",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyslice"]
