[project]
name = "PySlice"
version = "0.1.0"
description = "Multislice electron scattering and TACAW vibrational EELS simulations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase",
    "matplotlib",
    "numpy",
    "ovito",
    "scipy",
    "tqdm",
    "typing-extensions",
    "h5py",
]

[project.optional-dependencies]
fast = ["torch","torchvision"]
test = ["pytest"]
md = ["orb-models>=0.6.0; python_version < '3.13'"]

[project.urls]
Homepage = "https://github.com/h-walk/PySlice"
Documentation = "https://github.com/h-walk/PySlice/tree/main/docs/user-guide"
Issues = "https://github.com/h-walk/PySlice/issues"

[tool.hatch.build]
include = [
    "src/pyslice/data/*.txt",
    "src/pyslice/data/*.json",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyslice"]
