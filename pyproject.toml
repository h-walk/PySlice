[project]
name = "PySlice"
version = "0.1.0"
description = "PyTorch based package for EELS calculations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ase",
    "dataclasses",
    "matplotlib",
    "numpy",
    "ovito",
    "pathlib",
    "scipy",
    "tqdm",
    "typing-extensions",
    "h5py",
]

[project.optional-dependencies]
fast = ["torch","torchvision"]
test = []
md = ["orb-models>=0.6.0; python_version < '3.13'"]

[project.urls]
Homepage = "https://github.com/h-walk/PySlice"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyslice"]

# The sdist needs its own file list: without it hatchling inherited the old
# global data-only include and shipped zero Python source, so any sdist-based
# install (PyPI, `python -m build`, `uv build`) produced an empty package.
[tool.hatch.build.targets.sdist]
include = [
    "/src/pyslice",
    "/README.md",
    "/LICENSE",
    "/INSTALL.md",
    "/pyproject.toml",
]
