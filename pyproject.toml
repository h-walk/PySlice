[project]
name = "PySlice"
version = "0.1.0"
description = "PyTorch based package for EELS calculations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ase",
    "matplotlib",
    "numpy",
    "scipy",
    "tqdm",
    "typing-extensions",
    "h5py",
]
# `dataclasses` and `pathlib` were listed here but are the standard library on
# every supported Python (>=3.12); their PyPI backports are for EOL Pythons and
# the `pathlib` backport actively breaks modern interpreters. `ovito` needs a
# non-PyPI index and is imported lazily (only when reading OVITO/LAMMPS files),
# so it is an optional extra rather than a hard install-time dependency.

[project.optional-dependencies]
fast = ["torch","torchvision"]
io = ["ovito"]                     # OVITO/LAMMPS trajectory reader (special index)
test = ["pytest", "pytest-cov"]
md = ["orb-models>=0.6.0; python_version < '3.13'"]

[project.urls]
Homepage = "https://github.com/h-walk/PySlice"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyslice"]

# The sdist needs its own file list: without it hatchling inherited the old
# global data-only include and shipped zero Python source, so any sdist-based
# install (PyPI, `python -m build`, `uv build`) produced an empty package.
[tool.hatch.build.targets.sdist]
include = [
    "/src/pyslice",
    "/README.md",
    "/LICENSE",
    "/INSTALL.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
# Collect only the `test_*.py` suites in tests/. The legacy `NN_name.py`
# eyeball scripts do not match this pattern and are therefore never imported
# (they call plt.show() and load multi-GB inputs — unfit for CI).
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "torch: requires the optional PyTorch backend",
    "md: requires an MD engine (orb-models)",
    "ovito: requires the optional OVITO reader",
    "multigpu: requires >1 visible CUDA device",
    "slow: excluded from the fast default run",
]

[tool.coverage.run]
source = ["pyslice"]
branch = true
# Demos are never collected; the data/ helpers are vendored scripts, not package
# code exercised by the suite.
omit = [
    "*/pyslice/data/NOTsignal.py",
    "*/pyslice/data/pyslice_serial.py",
    "*/pyslice/backend_old.py",
]

[tool.coverage.report]
show_missing = true
# A hard `fail_under` gate is intentionally deferred until the regression suite
# is split per-module and coverage can be measured and ratcheted (see
# /workspaces/run/pyslice_test_overhaul_2026-07-18.md).
